services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unisync-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVE_STATIC: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      DB_SYNC: ${DB_SYNC:-false}
      DB_LOGGING: ${DB_LOGGING:-false}
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unisync-frontend
    environment:
      UNISYNC_API_BASE_URL: ${UNISYNC_API_BASE_URL:-http://localhost:3000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
